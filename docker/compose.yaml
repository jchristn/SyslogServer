services:

  #
  # SyslogServer
  # See https://hub.docker.com/r/jchristn77/syslogserver
  # and https://github.com/jchristn/syslogserver
  #

  syslogserver:
    container_name: 'syslogserver'
    image: 'jchristn77/syslogserver:v2.0.0'
    network_mode: 'host'
    stdin_open: true
    tty: true
    volumes:
      - ./syslog.json:/app/syslog.json
      - ./logs/:/app/logs/
